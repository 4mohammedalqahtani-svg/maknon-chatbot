# تحديث معرفة المساعد الذكي تلقائيًا كل يوم
# يرسل طلب إعادة النشر إلى Netlify، فيعيد قراءة ملفات Google Drive.
# الموعد: الساعة 12 منتصف الليل بتوقيت الرياض (21:00 بتوقيت UTC).
# للتحديث الفوري: GitHub > Actions > Daily knowledge update > Run workflow

name: Daily knowledge update

on:
  schedule:
    - cron: '0 21 * * *'
  workflow_dispatch:

jobs:
  trigger-netlify:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Netlify build hook
        env:
          HOOK_RAW: ${{ secrets.NETLIFY_BUILD_HOOK }}
        run: |
          # نستخرج الرابط الصحيح حتى لو لُصق معه مسافات أو علامات تنصيص أو أسطر إضافية
          HOOK=$(printf '%s' "$HOOK_RAW" | grep -o 'https://api\.netlify\.com/build_hooks/[A-Za-z0-9]*' | head -n 1)
          if [ -z "$HOOK" ]; then
            echo "::error::NETLIFY_BUILD_HOOK secret is missing or does not contain a https://api.netlify.com/build_hooks/... link"
            exit 1
          fi
          curl -fsS -X POST -H 'Content-Type: application/json' -d '{}' "$HOOK"
          echo "Netlify build triggered."
